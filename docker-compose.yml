version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vocx_postgres
    environment:
      POSTGRES_DB: vocx_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vocx_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/vocx_ai
      - SECRET_KEY=vocx-ai-super-secret-jwt-key-production-grade-2026
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vocx_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
